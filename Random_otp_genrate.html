<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stylish OTP Generator</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #otpDisplay {
            font-size: 24px;
            margin: 20px 0;
            color: #2d2d2d;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .tools {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .timer {
            margin-top: 10px;
            color: #777;
        }

        .toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: none;
            animation: fadeinout 2s;
        }

        @keyframes fadeinout {
            0% { opacity: 0; bottom: 0px; }
            10% { opacity: 1; bottom: 20px; }
            90% { opacity: 1; bottom: 20px; }
            100% { opacity: 0; bottom: 0px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>OTP Generator</h2>
    <div id="otpDisplay">Click generate</div>
    <div class="tools">
        <button onclick="generateOTP()">Generate</button>
        <button onclick="copyOTP()">Copy</button>
    </div>
    <div class="timer" id="timer"></div>
</div>

<div class="toast" id="toast">OTP copied to clipboard!</div>

<script>
    let currentOTP = '';
    let countdown;

    function generateOTP() {
        const otp = Math.floor(100000 + Math.random() * 900000);
        currentOTP = otp;
        document.getElementById('otpDisplay').innerText = 'Your OTP is: ' + otp;
        startTimer(30); // 30 seconds expiry
    }

    function copyOTP() {
        if (!currentOTP) return;
        navigator.clipboard.writeText(currentOTP.toString());
        showToast();
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    function startTimer(duration) {
        clearInterval(countdown);
        let timeLeft = duration;
        const timerDisplay = document.getElementById('timer');
        timerDisplay.textContent = `OTP expires in ${timeLeft} sec`;

        countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = 'OTP expired';
                document.getElementById('otpDisplay').innerText = 'Click generate';
                currentOTP = '';
            } else {
                timerDisplay.textContent = `OTP expires in ${timeLeft} sec`;
            }
        }, 1000);
    }
</script>

</body>
</html>
